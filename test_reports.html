<!DOCTYPE html>
<html>
<head>
    <title>Test Reports JS</title>
</head>
<body>
    <h1>Test Report Generator</h1>
    
    <select id="reportType">
        <option value="">Select</option>
        <option value="event">Event Report</option>
    </select>
    
    <select id="reportPeriod">
        <option value="month">Last Month</option>
    </select>
    
    <select id="reportFormat">
        <option value="pdf">PDF</option>
    </select>
    
    <input type="date" id="startDate">
    <input type="date" id="endDate">
    
    <button onclick="testClick()">Test Direct Click</button>
    <button onclick="generateReport()">Test Generate Report</button>
    
    <div id="output"></div>
    
    <script>
        function testClick() {
            document.getElementById('output').innerHTML = 'Direct click works!';
            console.log('Direct click works!');
        }
        
        // Check if generateReport is defined
        window.addEventListener('load', function() {
            console.log('Page loaded');
            console.log('generateReport exists?', typeof generateReport);
            console.log('reportType element:', document.getElementById('reportType'));
        });
    </script>
    
    <script src="public/js/admin/reports.js"></script>
</body>
</html>
