<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="jerseyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jerseyFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="jerseyFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
  </defs>
  <rect width="300" height="300" fill="url(#jerseyGradient)" rx="20"/>
  
  <!-- Jersey main body -->
  <rect x="120" y="80" width="60" height="90" fill="url(#jerseyFabric)" rx="6" filter="url(#jerseyFilter)"/>
  
  <!-- Sleeves -->
  <rect x="105" y="85" width="20" height="40" fill="url(#jerseyFabric)" rx="10" filter="url(#jerseyFilter)"/>
  <rect x="175" y="85" width="20" height="40" fill="url(#jerseyFabric)" rx="10" filter="url(#jerseyFilter)"/>
  
  <!-- V-neck collar -->
  <path d="M 135 80 L 150 70 L 165 80 L 165 85 L 135 85 Z" fill="url(#jerseyFabric)" filter="url(#jerseyFilter)"/>
  
  <!-- Professional collar trim -->
  <path d="M 135 80 L 150 70 L 165 80" stroke="#334155" stroke-width="2" fill="none"/>
  
  <!-- Professional team logo area -->
  <circle cx="140" cy="105" r="12" fill="none" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="109" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="8" font-weight="bold">ELITE</text>
  
  <!-- Side panels/seams -->
  <rect x="115" y="90" width="3" height="70" fill="#334155" opacity="0.4"/>
  <rect x="182" y="90" width="3" height="70" fill="#334155" opacity="0.4"/>
  
  <!-- Player number -->
  <text x="150" y="145" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="28" font-weight="bold">7</text>
  
  <!-- Performance fabric indicators -->
  <rect x="155" y="100" width="20" height="8" fill="none" stroke="#8b5cf6" stroke-width="1" rx="2"/>
  <text x="165" y="106" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="4" font-weight="bold">DRY-FIT</text>
  
  <!-- Mesh ventilation areas -->
  <circle cx="125" cy="95" r="1" fill="#64748b" opacity="0.5"/>
  <circle cx="130" cy="97" r="1" fill="#64748b" opacity="0.5"/>
  <circle cx="125" cy="102" r="1" fill="#64748b" opacity="0.5"/>
  
  <circle cx="175" cy="95" r="1" fill="#64748b" opacity="0.5"/>
  <circle cx="170" cy="97" r="1" fill="#64748b" opacity="0.5"/>
  <circle cx="175" cy="102" r="1" fill="#64748b" opacity="0.5"/>
  
  <!-- Professional sponsor area -->
  <rect x="125" y="155" width="50" height="8" fill="none" stroke="#334155" stroke-width="0.8" rx="2"/>
  <text x="150" y="161" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="5" font-weight="bold">PERFORMANCE WEAR</text>
  
  <!-- Size tag -->
  <rect x="175" y="165" width="8" height="4" fill="#e2e8f0" stroke="#334155" stroke-width="0.5"/>
  <text x="179" y="168" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="3" font-weight="bold">XL</text>
  
  <!-- Professional certification -->
  <circle cx="150" cy="200" r="8" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="150" y="204" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="8" font-weight="bold">✓</text>
  
  <!-- Moisture management technology -->
  <rect x="110" y="220" width="80" height="12" fill="none" stroke="#334155" stroke-width="1" rx="2"/>
  <text x="150" y="228" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="7" font-weight="bold">MOISTURE WICKING</text>
  
  <!-- Professional features indicators -->
  <circle cx="130" cy="240" r="3" fill="#8b5cf6" opacity="0.7"/>
  <text x="140" y="242" fill="#334155" font-family="Arial, sans-serif" font-size="5" font-weight="bold">UV Protection</text>
  
  <circle cx="130" cy="250" r="3" fill="#06b6d4" opacity="0.7"/>
  <text x="140" y="252" fill="#334155" font-family="Arial, sans-serif" font-size="5" font-weight="bold">Anti-Microbial</text>
  
  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="10" fill="rgba(139, 92, 246, 0.1)"/>
  <circle cx="240" cy="240" r="12" fill="rgba(51, 65, 85, 0.1)"/>
  <circle cx="40" cy="220" r="8" fill="rgba(16, 185, 129, 0.1)"/>
  
  <text x="150" y="280" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Elite Performance Jersey</text>
</svg>