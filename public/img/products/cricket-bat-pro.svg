<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="batGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="batWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4f1e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#451a03;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#78350f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a16207;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>
  <rect width="300" height="300" fill="url(#batGradient)" rx="20"/>
  
  <!-- Cricket bat blade -->
  <rect x="140" y="40" width="20" height="130" fill="url(#batWood)" rx="10" filter="url(#dropShadow)"/>
  
  <!-- Wood grain details -->
  <path d="M145 45 Q150 60 145 75 Q150 90 145 105 Q150 120 145 135 Q150 150 145 165" 
        stroke="#e0d6c7" stroke-width="0.8" fill="none" opacity="0.7"/>
  <path d="M155 45 Q150 60 155 75 Q150 90 155 105 Q150 120 155 135 Q150 150 155 165" 
        stroke="#e0d6c7" stroke-width="0.8" fill="none" opacity="0.7"/>
  
  <!-- Handle -->
  <rect x="135" y="170" width="30" height="80" fill="url(#handleGrad)" rx="15" filter="url(#dropShadow)"/>
  
  <!-- Professional grip wrapping -->
  <rect x="138" y="175" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="181" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="187" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="193" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="199" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="205" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="211" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="217" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="223" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="229" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="235" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  <rect x="138" y="241" width="24" height="2.5" fill="#1f2937" rx="1" opacity="0.9"/>
  
  <!-- Cap/pommel -->
  <rect x="145" y="30" width="10" height="15" fill="#334155" rx="5" filter="url(#dropShadow)"/>
  
  <!-- Professional branding -->
  <rect x="132" y="70" width="36" height="12" fill="none" stroke="#334155" stroke-width="1.2" rx="2"/>
  <text x="150" y="78" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="7" font-weight="bold">ELITE PRO</text>
  
  <!-- Weight specification -->
  <text x="150" y="90" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="5" font-weight="600">2.9 LBS</text>
  
  <!-- Sweet spot indicator -->
  <ellipse cx="150" cy="120" rx="6" ry="18" fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.6"/>
  <text x="150" y="124" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="4" font-weight="bold">SWEET SPOT</text>
  
  <!-- Professional certification -->
  <circle cx="150" cy="155" r="6" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="150" y="158" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="6" font-weight="bold">✓</text>
  
  <!-- Decorative elements -->
  <circle cx="70" cy="70" r="12" fill="rgba(139, 92, 246, 0.08)"/>
  <circle cx="230" cy="230" r="15" fill="rgba(59, 130, 246, 0.08)"/>
  <circle cx="50" cy="200" r="8" fill="rgba(6, 182, 212, 0.08)"/>
  
  <text x="150" y="280" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Elite Pro Series</text>
</svg>