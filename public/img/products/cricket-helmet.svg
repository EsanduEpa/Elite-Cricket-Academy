<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helmetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="helmetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="helmetFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  <rect width="300" height="300" fill="url(#helmetGradient)" rx="20"/>
  
  <!-- Helmet main body -->
  <ellipse cx="150" cy="120" rx="55" ry="50" fill="url(#helmetWhite)" filter="url(#helmetFilter)"/>
  
  <!-- Face guard frame -->
  <rect x="115" y="140" width="70" height="35" fill="none" stroke="#334155" stroke-width="2.5" rx="18"/>
  
  <!-- Grille vertical bars -->
  <line x1="125" y1="145" x2="125" y2="170" stroke="#334155" stroke-width="1.8"/>
  <line x1="135" y1="145" x2="135" y2="170" stroke="#334155" stroke-width="1.8"/>
  <line x1="145" y1="145" x2="145" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="155" y1="145" x2="155" y2="170" stroke="#334155" stroke-width="2"/>
  <line x1="165" y1="145" x2="165" y2="170" stroke="#334155" stroke-width="1.8"/>
  <line x1="175" y1="145" x2="175" y2="170" stroke="#334155" stroke-width="1.8"/>
  
  <!-- Horizontal support bars -->
  <line x1="120" y1="152" x2="180" y2="152" stroke="#334155" stroke-width="1.2"/>
  <line x1="120" y1="160" x2="180" y2="160" stroke="#334155" stroke-width="1.2"/>
  <line x1="120" y1="168" x2="180" y2="168" stroke="#334155" stroke-width="1.2"/>
  
  <!-- Premium ventilation system -->
  <circle cx="125" cy="100" r="2.5" fill="#64748b"/>
  <circle cx="140" cy="95" r="2.5" fill="#64748b"/>
  <circle cx="150" cy="92" r="2.5" fill="#64748b"/>
  <circle cx="160" cy="95" r="2.5" fill="#64748b"/>
  <circle cx="175" cy="100" r="2.5" fill="#64748b"/>
  
  <!-- Side ventilation -->
  <circle cx="110" cy="125" r="2" fill="#64748b"/>
  <circle cx="110" cy="135" r="2" fill="#64748b"/>
  <circle cx="190" cy="125" r="2" fill="#64748b"/>
  <circle cx="190" cy="135" r="2" fill="#64748b"/>
  
  <!-- Side protection panels -->
  <ellipse cx="105" cy="130" rx="10" ry="25" fill="url(#helmetWhite)" filter="url(#helmetFilter)"/>
  <ellipse cx="195" cy="130" rx="10" ry="25" fill="url(#helmetWhite)" filter="url(#helmetFilter)"/>
  
  <!-- Chin guard -->
  <path d="M 125 175 Q 150 185 175 175" stroke="#334155" stroke-width="3" fill="none"/>
  <rect x="140" y="178" width="20" height="8" fill="url(#helmetWhite)" rx="4"/>
  
  <!-- Professional branding -->
  <rect x="125" y="108" width="50" height="10" fill="none" stroke="#334155" stroke-width="1" rx="2"/>
  <text x="150" y="115" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="6" font-weight="bold">ELITE SAFETY</text>
  
  <!-- Size and model indicator -->
  <circle cx="175" cy="110" r="7" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="175" y="113" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="6" font-weight="bold">XL</text>
  
  <!-- Professional certification -->
  <circle cx="150" cy="210" r="8" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="150" y="214" text-anchor="middle" fill="#10b981" font-family="Arial, sans-serif" font-size="8" font-weight="bold">✓</text>
  
  <!-- Safety standards -->
  <rect x="115" y="235" width="70" height="12" fill="none" stroke="#334155" stroke-width="1" rx="2"/>
  <text x="150" y="243" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="7" font-weight="bold">ICC APPROVED</text>
  
  <!-- Decorative elements -->
  <circle cx="60" cy="60" r="10" fill="rgba(139, 92, 246, 0.1)"/>
  <circle cx="240" cy="240" r="12" fill="rgba(51, 65, 85, 0.1)"/>
  <circle cx="40" cy="220" r="8" fill="rgba(16, 185, 129, 0.1)"/>
  
  <text x="150" y="275" text-anchor="middle" fill="#334155" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Elite Safety Helmet</text>
</svg>
  <ellipse cx="195" cy="130" rx="8" ry="20" fill="url(#helmetWhite)"/>
  
  <circle cx="220" cy="200" r="25" fill="rgba(255,255,255,0.1)"/>
  <text x="150" y="280" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Cricket Helmet - $159.99</text>
</svg>