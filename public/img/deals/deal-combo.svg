<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dealComboGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="comboHighlight" cx="80%" cy="20%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#dealComboGradient)" rx="12"/>
  <rect width="400" height="250" fill="url(#comboHighlight)" rx="12"/>
  
  <!-- Sale badge -->
  <circle cx="350" cy="50" r="35" fill="#dc2626"/>
  <text x="350" y="45" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">20%</text>
  <text x="350" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">OFF</text>
  
  <!-- Batting Gloves -->
  <ellipse cx="80" cy="100" rx="20" ry="25" fill="#ffffff"/>
  <rect x="65" y="75" width="30" height="12" fill="#ffffff" rx="6"/>
  <!-- Glove fingers -->
  <rect x="68" y="70" width="4" height="18" fill="#ffffff" rx="2"/>
  <rect x="75" y="68" width="4" height="20" fill="#ffffff" rx="2"/>
  <rect x="82" y="68" width="4" height="20" fill="#ffffff" rx="2"/>
  <rect x="89" y="70" width="4" height="18" fill="#ffffff" rx="2"/>
  
  <!-- Leg Pads -->
  <rect x="130" y="60" width="20" height="90" fill="#ffffff" rx="10"/>
  <rect x="155" y="60" width="20" height="90" fill="#e0f2fe" rx="10"/>
  
  <!-- Pad sections -->
  <rect x="135" y="70" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  <rect x="135" y="90" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  <rect x="135" y="110" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  <rect x="135" y="130" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  
  <rect x="160" y="70" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  <rect x="160" y="90" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  <rect x="160" y="110" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  <rect x="160" y="130" width="10" height="15" fill="none" stroke="#1e40af" stroke-width="1" rx="2"/>
  
  <!-- Plus sign -->
  <rect x="108" y="122" width="12" height="3" fill="#ffffff" rx="1"/>
  <rect x="112.5" y="117.5" width="3" height="12" fill="#ffffff" rx="1"/>
  
  <!-- Text content -->
  <text x="220" y="90" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="bold">COMBO DEAL</text>
  <text x="220" y="115" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.9">Gloves + Pads</text>
  <text x="220" y="135" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.8">Professional Protection Set</text>
  
  <!-- Price display -->
  <text x="220" y="170" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="14">Bundle Price</text>
  <text x="220" y="190" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">$175.99</text>
  <text x="310" y="190" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="16" text-decoration="line-through">$219.99</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="350" cy="200" r="15" fill="rgba(255,255,255,0.08)"/>
  <circle cx="180" cy="40" r="8" fill="rgba(255,255,255,0.12)"/>
</svg>