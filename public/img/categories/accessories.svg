  <rect x="90" y="105" width="8" height="20" fill="#06b6d4" rx="2"/>
  <circle cx="94" cy="103" r="3" fill="#1e40af"/>
  
  <!-- Towel -->
  <rect x="110" y="108" width="15" height="3" fill="#ffffff" rx="1"/>
  <rect x="110" y="113" width="15" height="3" fill="#ffffff" rx="1"/>
  <rect x="110" y="118" width="15" height="3" fill="#ffffff" rx="1"/>
  
  <!-- Protective Gear -->
  <rect x="135" y="105" width="12" height="18" fill="#ffffff" rx="2"/>
  <rect x="138" y="108" width="6" height="12" fill="none" stroke="#1e40af" stroke-width="1" rx="1"/>
  
  <!-- Grip tape -->
  <rect x="155" y="110" width="10" height="3" fill="#1e40af" rx="1"/>
  <rect x="155" y="115" width="10" height="3" fill="#ffffff" rx="1"/>
  <rect x="155" y="120" width="10" height="3" fill="#1e40af" rx="1"/>
  
  <circle cx="60" cy="60" r="15" fill="rgba(255,255,255,0.1)"/>
  <circle cx="190" cy="230" r="18" fill="rgba(255,255,255,0.1)"/>
  
  <text x="125" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Accessories</text>
  <text x="125" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.9">89 Products</text>
