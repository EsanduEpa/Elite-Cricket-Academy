      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="250" height="280" fill="url(#accessoriesGradient)" rx="12"/>
  
  <!-- Cricket Kit Bag -->
  <rect x="70" y="90" width="110" height="60" fill="#ffffff" rx="8"/>
  
