<svg width="250" height="280" viewBox="0 0 250 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="helmetsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="250" height="280" fill="url(#helmetsGradient)" rx="12"/>
  
  <!-- Main helmet -->
  <ellipse cx="125" cy="100" rx="40" ry="35" fill="#ffffff"/>
  
  <!-- Face guard -->
  <rect x="100" y="115" width="50" height="25" fill="none" stroke="#1e40af" stroke-width="2" rx="12"/>
  
  <!-- Grille lines vertical -->
  <line x1="110" y1="120" x2="110" y2="135" stroke="#1e40af" stroke-width="1"/>
  <line x1="118" y1="120" x2="118" y2="135" stroke="#1e40af" stroke-width="1"/>
  <line x1="125" y1="120" x2="125" y2="135" stroke="#1e40af" stroke-width="1"/>
  <line x1="132" y1="120" x2="132" y2="135" stroke="#1e40af" stroke-width="1"/>
  <line x1="140" y1="120" x2="140" y2="135" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Grille lines horizontal -->
  <line x1="105" y1="125" x2="145" y2="125" stroke="#1e40af" stroke-width="1"/>
  <line x1="105" y1="130" x2="145" y2="130" stroke="#1e40af" stroke-width="1"/>
  
  <!-- Ventilation holes -->
  <circle cx="110" cy="85" r="2" fill="#3b82f6"/>
  <circle cx="120" cy="82" r="2" fill="#3b82f6"/>
  <circle cx="130" cy="82" r="2" fill="#3b82f6"/>
  <circle cx="140" cy="85" r="2" fill="#3b82f6"/>
  
  <!-- Side protection -->
  <ellipse cx="90" cy="105" rx="6" ry="16" fill="#ffffff"/>
  <ellipse cx="160" cy="105" rx="6" ry="16" fill="#ffffff"/>
  
  <circle cx="190" cy="70" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="70" cy="220" r="15" fill="rgba(255,255,255,0.1)"/>
  
  <text x="125" y="190" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">Helmets</text>
  <text x="125" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.9">18 Products</text>
</svg>