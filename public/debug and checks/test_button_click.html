<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Click Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #4A90E2;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #357abd;
        }
        .log {
            background: #000;
            color: #0f0;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>🔍 Button Click Diagnostic Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Direct Button Click</h2>
        <p>Click this button and watch the console:</p>
        <button id="testBtn1" onclick="console.log('✅ Inline onclick works!'); alert('Inline onclick works!');">
            Click Me (Inline)
        </button>
    </div>
    
    <div class="test-section">
        <h2>Test 2: addEventListener Click</h2>
        <p>Click this button (event listener attached in script):</p>
        <button id="testBtn2">Click Me (addEventListener)</button>
    </div>
    
    <div class="test-section">
        <h2>Test 3: Simulate Events Page Button</h2>
        <p>Same ID as your events page button:</p>
        <button id="createEventBtn">
            <i class="fas fa-plus-circle"></i>
            Create New Event
        </button>
    </div>
    
    <div class="test-section">
        <h2>Console Output:</h2>
        <div class="log" id="logOutput"></div>
    </div>

    <script>
        // Capture console.log
        const logDiv = document.getElementById('logOutput');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = args.join(' ');
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        // Test initialization
        console.log('=== DIAGNOSTIC TEST STARTED ===');
        console.log('Timestamp:', new Date().toISOString());
        
        // Test 2: addEventListener
        document.addEventListener('DOMContentLoaded', function() {
            console.log('✅ DOMContentLoaded fired');
            
            const testBtn2 = document.getElementById('testBtn2');
            console.log('Test button 2 found:', !!testBtn2);
            
            if (testBtn2) {
                testBtn2.addEventListener('click', function() {
                    console.log('✅ addEventListener click works!');
                    alert('addEventListener click works!');
                });
                console.log('✅ Event listener attached to testBtn2');
            }
            
            // Test 3: Simulate events page scenario
            const createEventBtn = document.getElementById('createEventBtn');
            console.log('createEventBtn found:', !!createEventBtn);
            
            if (createEventBtn) {
                createEventBtn.addEventListener('click', function() {
                    console.log('✅ createEventBtn clicked!');
                    console.log('This should work on events page too');
                    alert('Button works! If this test works but events page doesn\'t, check:\n1. JavaScript loading order\n2. Other scripts interfering\n3. Button being inside a form');
                });
                console.log('✅ Event listener attached to createEventBtn');
            } else {
                console.error('❌ createEventBtn not found!');
            }
            
            console.log('=== SETUP COMPLETE - TRY CLICKING BUTTONS ===');
        });
    </script>
</body>
</html>
