<!DOCTYPE html>
<html>
<head>
    <title>Test Add Workout Form</title>
</head>
<body>
    <h1>Test Workout Form Submission</h1>
    
    <form action="http://localhost/Elite/trainer/addWorkoutPlan" method="POST">
        <div>
            <label>Workout Name:</label>
            <input type="text" name="workoutname" value="Manual Test Workout" required>
        </div>
        
        <div>
            <label>Frequency:</label>
            <select name="frequency" required>
                <option value="Daily">Daily</option>
                <option value="Weekly">Weekly</option>
                <option value="Bi-weekly">Bi-weekly</option>
            </select>
        </div>
        
        <div>
            <label>Duration (days):</label>
            <input type="number" name="duration" value="45" min="1" max="365" required>
        </div>
        
        <div>
            <label>Intensity:</label>
            <select name="intensity" required>
                <option value="Low">Low</option>
                <option value="Moderate" selected>Moderate</option>
                <option value="High">High</option>
            </select>
        </div>
        
        <div>
            <label>Video Link (optional):</label>
            <input type="url" name="videolink" value="https://youtube.com/watch?v=testmanual">
        </div>
        
        <div>
            <label>Benefits (optional):</label>
            <textarea name="benefits">Great for building strength and endurance</textarea>
        </div>
        
        <div>
            <label>Not Suitable For (optional):</label>
            <textarea name="notsuitablefor">People with recent injuries or heart conditions</textarea>
        </div>
        
        <div>
            <input type="hidden" name="trainer_id" value="10">
            <button type="submit">Submit Workout Plan</button>
        </div>
    </form>
    
    <hr>
    <h2>Instructions:</h2>
    <ol>
        <li>Click the "Submit Workout Plan" button above</li>
        <li>This will test the actual form submission to the controller</li>
        <li>You should be redirected to the workout page with a success message</li>
    </ol>
</body>
</html>
